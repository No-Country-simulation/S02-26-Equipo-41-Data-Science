services:
  # La base de datos
  db:
    image: postgres:16
    container_name: nocountry-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - '5432:5432'
    volumes:
      - nocountry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tu Backend (Ahora con variables de entorno)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-container
    ports:
      - "3000:3000"
    restart: on-failure
    # IMPORTANTE: Cargamos el archivo que crea Jenkins
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@nocountry-postgres:5432/db
    depends_on:
      db:
        condition: service_healthy

  # Tu Frontend
  frontend:
    build: 
      context: ./front-end
      dockerfile: Dockerfile
    container_name: frontend-container
    ports:
      - "8081:80"
    restart: always

volumes:
  nocountry_pgdata: